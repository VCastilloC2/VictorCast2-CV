# Configuración de Netlify para CV Generator

# Configuración base
[build]
  publish = "."
  command = ""
  functions = ""

# Reglas de redirección
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers de seguridad
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Headers para archivos estáticos
[[headers]]
  for = "/Assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"

[[headers]]
  for = "/*.css"
  [headers.values]
    Content-Type = "text/css; charset=utf-8"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "max-age=300"

# Configuración de contextos para diferentes entornos
[context.production]
  environment = { NODE_ENV = "production" }

[context.deploy-preview]
  environment = { NODE_ENV = "development" }

[context.branch-deploy]
  environment = { NODE_ENV = "development" }

# Funciones Edge (si en futuro se necesitan)
[functions]
  # directory = "functions"

# Variables de entorno
[env]
  SITE_NAME = "CV Generator - Victor Jose Castillo"
  SITE_DESCRIPTION = "Generador profesional de CV en PDF"